[URL]
Port=7777
IGWPort=7888

[ConsoleVariables]
; ============================================
; BASEBUILDER CONFIG - UserEngine.ini
; Playstyle: Casual basebuilding + challenging combat
; Upload via FileBrowser: http://192.168.0.72:18888
; Path: UserSettings/UserEngine.ini
; ============================================

BattlEye.Enabled=false
bDeveloperMode=True

; --- Server Identity ---
; Bgd.ServerDisplayName="SUPER"
; Bgd.ServerLoginPassword="SECRET"

; ===== RESOURCES (Boosted for building focus) =====
Dune.GlobalMiningOutputMultiplier=2.5
Dune.GlobalVehicleMiningOutputMultiplier=2.5
SecurityZones.PvpResourceMultiplier=3.0

; ===== VEHICLES (Protected - you need them for materials) =====
dw.VehicleDurabilityDamageMultiplier=0.3
Vehicle.SandwormInvulnerabilitySecondsOnServerRestart=10800.0
Vehicle.SandwormInvulnerabilitySecondsOnExit=1800.0
Vehicle.SandwormCollisionInteraction=false

; ===== WEATHER (Dramatic but base-friendly) =====
Sandstorm.Enabled=1
Sandstorm.Treasure.Enabled=1
Sandstorm.AutoSpawn=true
Sandstorm.CoriolisAutoSpawnEnabled=true

; ===== SANDWORMS (Keep dangerous for challenge) =====
sandworm.dune.Enabled=1
Sandworm.SandwormDangerZonesEnabled=true

; ===== SURVIVAL (Core mechanics intact for challenge) =====
Hydration.Enabled=true

; ===== COMBAT (Keep NPC threat real) =====
; Default NPC damage - no reduction for challenge
